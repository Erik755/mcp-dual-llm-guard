[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mcp-dual-llm-guard"
version = "0.1.0"
description = "Dual LLM with Symbolic Memory: a reference-monitor middleware that defends MCP agents against indirect prompt injection and tool poisoning."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Erik Sanchez" }]
keywords = [
  "llm-security", "prompt-injection", "mcp", "model-context-protocol",
  "agentic-ai", "dual-llm", "owasp", "taint-tracking",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
openai = ["httpx>=0.27,<1"]
mcp = ["mcp>=2.2,<3"]
dev = [
  "httpx>=0.27,<1",
  "mcp>=2.2,<3",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/Erik755/mcp-dual-llm-guard"
Issues = "https://github.com/Erik755/mcp-dual-llm-guard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dual_llm_guard"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "C4", "PT", "RET", "ARG", "PL", "TRY", "N", "D"]
ignore = [
  "D105", "D107",                   # dunder/__init__ docs live on the class
  "N818",                           # exception names follow the security vocabulary of the spec
  "PLR0913",                        # keyword-only config constructors are intentional
  "PLR2004", "TRY003", "PLR0911", "PLR0912",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "PLR2004", "S105", "S106", "PLC0415"]
"examples/**" = ["T201", "D103", "S101", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = ["src", "tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["dual_llm_guard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$", "raise NotImplementedError"]
